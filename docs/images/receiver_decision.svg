<text x="198.96" y="422" font-size="11" fill="#2C2C2A">reference line: how tall a 1 is</text>
<line x1="400.28" y1="418" x2="424.28" y2="418" stroke="#BA7517" stroke-width="2"/>
<text x="430.28" y="422" font-size="11" fill="#2C2C2A">decision line</text>
<rect x="528.64" y="412" width="12" height="12" fill="#1D9E75" stroke="#1D9E75" stroke-width="0.5" rx="2"/>
<text x="546.64" y="422" font-size="11" fill="#2C2C2A">decided 1</text>
<rect x="622.12" y="412" width="12" height="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" rx="2"/>
<text x="640.12" y="422" font-size="11" fill="#2C2C2A">decided 0</text>
<text x="24" y="448" font-size="11" fill="#5F5E5A">The markers have the height of a data 1, so the line from the START crest to the STOP crest says how tall a 1 is at every slot, even in a fade.</text>
<text x="24" y="464" font-size="11" fill="#5F5E5A">A slot above the decision line is a 1. The smart line sits at 50–75 % of the reference (about 70 % when weak, lower when clean), never below the noise.</text>
</svg>
