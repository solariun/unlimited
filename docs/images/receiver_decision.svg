<title>Unlimited receiver decision</title>
<desc>Two real packages as the Decoder measured them: slot levels as bars, the dashed reference line from the START to the STOP crest, the amber decision line and the decided bits, in AWGN and in CCIR poor fading.</desc>
<rect x="0.5" y="0.5" width="819" height="479" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">How the receiver reads a package: the reference line and the decision line</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">Real Decoder slot and package events (ssb profile, smart line); the levels are the Decoder's slot amplitudes, in % of its running marker average.</text>
