<title>Unlimited bit error rate</title>
<desc>Measured bit error rate against SNR for 1, 3, 6, 12 and 25 bytes per second, with the fixed 70 % decision line and the adaptive line, through the USB channel simulator.</desc>
<rect x="0.5" y="0.5" width="819" height="559" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">Bit error rate in white noise, per speed (spec 4 A1)</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">16 transmissions of 16 random bytes per point through the USB channel simulator, mistuned +37 Hz; solid: fixed 70 % line, dashed: adaptive (auto).</text>
<text x="24" y="68" font-size="12" fill="#5F5E5A">SNR: the key-down tone over the noise in 2500 Hz. Triangles: the provisional gate of each speed (v0.3's at the same T). Open circles: no error (plotted at 1 / 2n).</text>
