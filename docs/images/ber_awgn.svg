<text x="24" y="492" font-size="11" fill="#5F5E5A">BER over the bytes the Decoder released (bit errors / bits matched to what was sent); hollow: the receiver missed some transmissions.</text>
<text x="24" y="508" font-size="11" fill="#5F5E5A">+3 dB per doubling of T. Near the left end the limit is acquisition (finding the tune and the sync train), not the slot decisions.</text>
<text x="24" y="524" font-size="11" fill="#5F5E5A">Spec gate: the release gate A1 of spec 4.1, where the BER must be ≤ 1e-3. The bound uses E1/N0 = SNR · 2500 Hz · T · 0.6875.</text>
