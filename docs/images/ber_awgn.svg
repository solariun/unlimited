<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="590" viewBox="0 0 900 590" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Unlimited bit error rate</title>
<desc>Measured bit error rate against SNR for 1, 3, 6, 12 and 25 bytes per second, with the adaptive decision line (the default, solid) and the fixed 70 % line (dashed), through the USB channel simulator.</desc>
<rect x="0.5" y="0.5" width="899" height="589" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">Bit error rate in white noise, per speed (spec 4 A1)</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">16 transmissions of 16 random bytes per point through the USB channel simulator, mistuned +37 Hz. Solid: the adaptive line (auto),</text>
<text x="24" y="68" font-size="12" fill="#5F5E5A">the decoder's default since 2026-09-28; dashed: the fixed 70 % line (selectable). SNR: the key-down tone over the noise in 2500 Hz.</text>
<text x="24" y="84" font-size="12" fill="#5F5E5A">Triangles: the provisional gate of each speed (v0.3's at the same T). Open circles: no error (plotted at 1 / 2n).</text>
