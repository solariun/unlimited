<title>Unlimited BER in AWGN</title>
<desc>Measured bit error rate against SNR for the hf_fast, hf, hf_robust and hf_weak presets, with noncoherent MFSK theory and the v0.1 OOK point.</desc>
<rect x="0.5" y="0.5" width="819" height="515" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">BER vs SNR in AWGN, measured on the integrated decoder</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">Real Encoder → sim::Channel (USB, AWGN, tuned ±50 Hz) → real Decoder (ssb profile).</text>
<text x="24" y="68" font-size="12" fill="#5F5E5A">50 transmissions of 250 random bytes per point (100000 bits sent), measured by make docs.</text>
