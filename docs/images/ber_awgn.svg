<title>Unlimited BER in AWGN</title>
<desc>Measured bit error rate against SNR for the hf_slow, hf and hf_fast presets through the real encoder, channel simulator and decoder, with the matched-filter bound and the dropped v0.2 hf point.</desc>
<rect x="0.5" y="0.5" width="819" height="539" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">BER vs SNR in AWGN, measured through the real chain</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">Encoder → sim::Channel (USB, AWGN, tuned ±50 Hz) → Decoder (ssb profile: it learns the pitch, T and N by itself).</text>
<text x="24" y="68" font-size="12" fill="#5F5E5A">100 transmissions of 250 random bytes per point (200000 bits sent); a fresh receiver for each transmission; measured by make docs.</text>
