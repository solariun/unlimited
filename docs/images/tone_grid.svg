<text x="24" y="452" font-size="11" fill="#5F5E5A">LSB mirrors the audio, so the grid lands on the other side of f_ref.</text>
<text x="24" y="468" font-size="11" fill="#5F5E5A">The tone index is the distance from f_ref, so the decoder only flips σ_rx; the header's ML decides it.</text>
