<text x="24" y="450" font-size="11" fill="#5F5E5A">The receiver searches 300..2700 Hz (from 1000 Hz below 8 ms): no filter leaves more room. Coral: less than 100 Hz of room.</text>
<text x="24" y="466" font-size="11" fill="#5F5E5A">In the 1.8 kHz filter a 1200 Hz pitch centres the band: hf ±762 Hz, fm −200 / +350 Hz; T &lt; 8 ms is for FM-like channels.</text>
