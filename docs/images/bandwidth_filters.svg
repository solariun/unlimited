<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="482" viewBox="0 0 820 482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Unlimited bandwidth and filters</title>
<desc>Occupied band of slot lengths 4 to 128 ms at 1500 Hz against SSB filters of 1.8, 2.4, 2.7 and 3.0 kHz, with the shift tolerance each filter leaves, computed by occupied_band() and passband_fit().</desc>
<rect x="0.5" y="0.5" width="819" height="481" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="24" y="32" font-size="16" fill="#2C2C2A" font-weight="bold">Bandwidth: every slot length against typical SSB filters</text>
<text x="24" y="52" font-size="12" fill="#5F5E5A">occupied_band(1500 Hz, T) against each filter; the table is passband_fit(config): how far the pitch may move down / up and still be heard (Hz).</text>
<line x1="331" y1="90.5" x2="331" y2="369" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="207" y="94.5" width="186" height="11" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" rx="2"/>
<text x="24" y="104" font-size="10" fill="#2C2C2A">SSB 1.8 kHz 300–2100 Hz</text>
<rect x="207" y="113.5" width="248" height="11" fill="#D8D6CC" stroke="#888780" stroke-width="0.8" rx="2"/>
<text x="24" y="123" font-size="10" fill="#2C2C2A" font-weight="bold">SSB 2.4 kHz 300–2700 Hz (default)</text>
<rect x="196.67" y="132.5" width="279" height="11" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" rx="2"/>
<text x="24" y="142" font-size="10" fill="#2C2C2A">SSB 2.7 kHz 200–2900 Hz</text>
<rect x="186.33" y="151.5" width="299.67" height="11" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" rx="2"/>
<text x="24" y="161" font-size="10" fill="#2C2C2A">SSB 3.0 kHz 100–3000 Hz</text>
<text x="506" y="104" font-size="12" fill="#2C2C2A" font-weight="bold">Shift tolerance at 1500 Hz (Hz):</text>
<text x="506" y="123" font-size="10" fill="#5F5E5A">down / up, inside the filter and the search</text>
<text x="542.25" y="196" font-size="10" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SSB 1.8 kHz</text>
<text x="542.25" y="208" font-size="9" fill="#5F5E5A" text-anchor="middle">300–2100</text>
<text x="614.75" y="196" font-size="10" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SSB 2.4 kHz</text>
<text x="614.75" y="208" font-size="9" fill="#5F5E5A" text-anchor="middle">300–2700</text>
<text x="687.25" y="196" font-size="10" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SSB 2.7 kHz</text>
<text x="687.25" y="208" font-size="9" fill="#5F5E5A" text-anchor="middle">200–2900</text>
<text x="759.75" y="196" font-size="10" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SSB 3.0 kHz</text>
<text x="759.75" y="208" font-size="9" fill="#5F5E5A" text-anchor="middle">100–3000</text>
<text x="24" y="208" font-size="10" fill="#5F5E5A" font-weight="bold">slot T, occupied band</text>
