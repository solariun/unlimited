<title>Unlimited late join: v0.3.0 and now</title>
<desc>A cold late join at T 8 ms, N 8, 20 dB: the release threw away the audio heard before its tone lock and locked after 8.2 packages; the current decoder keeps it and locks after 5.2; and the lock times of the 20 starts of the long suite's row, before and after.</desc>
<rect x="0.5" y="0.5" width="819" height="559" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
