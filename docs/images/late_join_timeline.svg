<text x="24" y="512" font-size="11" fill="#5F5E5A">v0.3.0 threw away all it had heard at its tone lock (and again at the fine AFC's first large correction): the join waited for three intervals heard after it.</text>
<text x="24" y="528" font-size="11" fill="#5F5E5A">Now the history is kept from the first 20 ms tone-search block on, mixed at the pitch the search leads with and re-mixed to the tone it locks on (spec 3.3, 3.6),</text>
<text x="24" y="544" font-size="11" fill="#5F5E5A">so the join starts from the first whole package heard; the lock follows 4.4 packages after that package's START (the guard's 4 packages and its END check).</text>
