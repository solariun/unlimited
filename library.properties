name=Unlimited
version=1.0.0
author=Gustavo Campos
maintainer=Gustavo Campos
sentence=Byte-streaming data modem for HF, VHF and UHF radio audio: one byte per window of 10 beeps on one pitch.
paragraph=Sends bytes like a serial port through an ordinary SSB, AM or FM transceiver: each byte is a START tone, 8 bits (a beep is 1, silence is 0) and a STOP tone; both stations set the same speed in bytes per second (1 to 25) and the receiver finds the pitch by itself.
